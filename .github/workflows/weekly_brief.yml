name: Weekly CEO Brief

on:
  schedule:
    - cron: '0 1 * * 1'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram notification
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "text=Monday backup reminder: keep your PC and the Claude app on today so the daily 8 AM business loop can run. MORGAN will message you if anything needs you."
